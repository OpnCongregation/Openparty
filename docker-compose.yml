# Verified with Docker Desktop on 2026-10-22. Start order: see "Run with Docker" in README (LOG_KEY comes from the log's first start).
services:
  postgres:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: openparty
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openparty"]
      interval: 2s
      timeout: 3s
      retries: 30

  trustlog:
    restart: unless-stopped
    build: ./services/trustlog
    environment:
      APPEND_TOKEN: ${APPEND_TOKEN:?set in .env}
      DATA_DIR: /data
      WITNESS_URLS: http://witness1:8080,http://witness2:8080
      ANCHOR_MODE: ${ANCHOR_MODE:-simulated}
      OTS_CALENDARS: ${OTS_CALENDARS:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-600}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-120}
    volumes: [logdata:/data]
    # Loopback only. Services reach the log over the compose network. To publish it, put a TLS reverse proxy in front.
    ports: ["127.0.0.1:8080:8080"]

  # Two witnesses on one host is for demonstration only. Real witnesses are run by independent parties.
  witness1:
    restart: unless-stopped
    build: ./services/trustlog
    command: ["witness"]
    environment: { DATA_DIR: /data, LOG_URL: "http://trustlog:8080", LOG_KEY: "${LOG_KEY:?copy from trustlog startup output}" }
    volumes: [w1data:/data]
  witness2:
    restart: unless-stopped
    build: ./services/trustlog
    command: ["witness"]
    environment: { DATA_DIR: /data, LOG_URL: "http://trustlog:8080", LOG_KEY: "${LOG_KEY:?copy from trustlog startup output}" }
    volumes: [w2data:/data]

  platform:
    restart: unless-stopped
    build: { context: ., dockerfile: services/platform/Dockerfile }
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/openparty
      MASTER_KEY_HEX: ${MASTER_KEY_HEX:-}
      PEPPER_HEX: ${PEPPER_HEX:?set in .env}
      TRUSTLOG_URL: http://trustlog:8080
      APPEND_TOKEN: ${APPEND_TOKEN}
      LAB_ENABLED: ${LAB_ENABLED:-0}
      NODE_ENV: production
      # An approval claimed longer ago than this and still unfinished is taken over and finished by recovery (checked every APPROVAL_RECOVERY_SECONDS).
      APPROVAL_LEASE_SECONDS: ${APPROVAL_LEASE_SECONDS:-60}
      APPROVAL_RECOVERY_SECONDS: ${APPROVAL_RECOVERY_SECONDS:-30}
      RECORD_NOTICE_SECONDS: ${RECORD_NOTICE_SECONDS:-3600}
      # scrypt (PIN hashing) runs on libuv's thread pool; its default size is 4.
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-8}
      # The USSD webhook only runs for a caller that sends this secret (the gateway). Give the same value to the gateway.
      USSD_WEBHOOK_SECRET: ${USSD_WEBHOOK_SECRET:-}
      USSD_ALLOWED_IPS: ${USSD_ALLOWED_IPS:-}
      USSD_RATE_AUTHFAIL: ${USSD_RATE_AUTHFAIL:-}
      USSD_RATE_PER_PHONE: ${USSD_RATE_PER_PHONE:-}
      USSD_RATE_PER_GATEWAY: ${USSD_RATE_PER_GATEWAY:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Master keys are held in the platform's memory (not an HSM). A production start refuses that unless acknowledged.
      ALLOW_SOFTWARE_KEYS: ${ALLOW_SOFTWARE_KEYS:-0}
      MASTER_KEYS: ${MASTER_KEYS:-}
      MASTER_KEY_ACTIVE: ${MASTER_KEY_ACTIVE:-}
      # Master keys in HashiCorp Vault Transit instead of memory (KEY_PROVIDER=vault; see docs/key-management.md). Then the key never
      # leaves Vault and ALLOW_SOFTWARE_KEYS is not needed.
      KEY_PROVIDER: ${KEY_PROVIDER:-software}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_TRANSIT_KEY: ${VAULT_TRANSIT_KEY:-openparty-master}
      VAULT_CREATE_IF_MISSING: ${VAULT_CREATE_IF_MISSING:-}
      # Lookup peppers can be rotated (npm run rotate-pepper); REF_PEPPER_HEX (public-log pseudonyms, donor keys) must never change.
      PEPPERS: ${PEPPERS:-}
      PEPPER_ACTIVE: ${PEPPER_ACTIVE:-}
      REF_PEPPER_HEX: ${REF_PEPPER_HEX:-}
    volumes: ["./reports:/reports:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      trustlog: { condition: service_started }
    # Loopback only: admin routes, the USSD webhook and the lab must not be reachable straight from the network.
    # Production: terminate TLS in a reverse proxy on the host or in the compose network and expose only the routes it needs.
    ports: ["127.0.0.1:3000:3000"]

  # A DEVELOPMENT Vault (in memory, root token "root"): for trying KEY_PROVIDER=vault locally with `docker compose --profile vault up`.
  # Production Vault needs persistent storage, TLS, auto-unseal (ideally an HSM or cloud KMS seal), HA and least-privilege policies.
  vault:
    profiles: ["vault"]
    image: hashicorp/vault:1.15
    cap_add: ["IPC_LOCK"]
    environment: { VAULT_DEV_ROOT_TOKEN_ID: root, VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200" }
    ports: ["127.0.0.1:8200:8200"]

  portal:
    restart: unless-stopped
    build: { context: ., dockerfile: apps/portal/Dockerfile }
    ports: ["127.0.0.1:3001:3001"]

volumes: { pgdata: {}, logdata: {}, w1data: {}, w2data: {} }
